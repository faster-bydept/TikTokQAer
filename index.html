<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare a trafficking sheet with a TikTok Ads export and download a discrepancy report.">
  <title>TikTok QAer by DEPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="script.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --tiktok-cyan: #00f2fe;
      --tiktok-red: #fe0468;
      --pink: #fe0468;
      --teal: #00d1a7;
      --white: #ffffff;
      --muted: #a3b8cc;
      --panel: rgba(6, 12, 24, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --danger-bg: rgba(255, 0, 80, 0.14);
      --danger-line: rgba(255, 0, 80, 0.45);
      --danger: #ff8aa6;
      --success: #00d1a7;
      --font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: 
        radial-gradient(circle at 82% 18%, rgba(254, 4, 104, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 18% 82%, rgba(0, 209, 167, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.6) 0%, transparent 100%),
        linear-gradient(135deg, #02040a 0%, #0a101d 50%, #12182b 100%);
      background-attachment: fixed;
      color: var(--white);
      font-family: var(--font-family);
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    button:focus-visible,
    label:focus-within,
    summary:focus-visible {
      outline: 3px solid rgba(0, 242, 254, 0.85);
      outline-offset: 4px;
    }

    .app-shell {
      width: min(1080px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 0 48px;
    }

    /* Centered Header */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: clamp(48px, 9vh, 80px);
      margin-bottom: 36px;
      text-align: center;
    }

    .brand-logo-img {
      display: block;
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(254, 4, 104, 0.35));
    }

    .brand-title {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }

    .brand-title-main {
      color: #ffffff;
      font-weight: 700;
    }

    .brand-title-accent {
      color: var(--tiktok-red);
      font-weight: 700;
    }

    .brand-title-dept {
      font-weight: 100;
      font-style: italic;
      font-size: 0.28em;
      color: rgba(255, 255, 255, 0.72);
      text-transform: none;
      letter-spacing: 0.2em;
      margin-left: 8px;
    }

    main { position: relative; }

    .view {
      width: 100%;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .view[hidden] { display: none; }

    .view.is-leaving {
      opacity: 0;
      transform: translateY(-12px);
    }

    .view.is-entering {
      opacity: 0;
      transform: translateY(14px);
    }

    .main-view {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 260px);
      padding: 12px 0 60px;
    }

    .upload-stage {
      width: min(780px, 100%);
      text-align: center;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
      align-items: start;
      gap: 18px;
    }

    .upload-slot {
      position: relative;
      min-width: 0;
    }

    /* Off-screen accessible file input */
    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      opacity: 0;
    }

    .upload-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 74px;
      padding: 16px 20px;
      border: 1.5px solid currentColor;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    /* Prevents child elements from blocking label click forwarding */
    .upload-button * {
      pointer-events: none;
    }

    .upload-button:hover {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 28px color-mix(in srgb, currentColor 28%, transparent);
      transform: translateY(-2px);
    }

    .upload-button.traffic { color: var(--tiktok-cyan); }
    .upload-button.tiktok { color: var(--tiktok-red); }

    .upload-button span { color: var(--white); }

    .file-name {
      display: block;
      min-height: 36px;
      margin: 11px 4px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name.has-file#trafficFileName {
      color: var(--tiktok-cyan);
      font-weight: 600;
    }

    .file-name.has-file#tiktokFileName {
      color: var(--tiktok-red);
      font-weight: 600;
    }

    .versus {
      display: grid;
      place-items: center;
      min-height: 74px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .analyze-wrap {
      display: inline-block;
      margin-top: 36px;
      padding: 1.5px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--tiktok-cyan), var(--tiktok-red));
      box-shadow: 0 10px 32px rgba(254, 4, 104, 0.35);
    }

    .analyze-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 195px;
      min-height: 52px;
      padding: 12px 28px;
      border: 0;
      border-radius: 9px;
      background: #080d18;
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .analyze-button:hover:not(:disabled) {
      background: #0f1728;
      transform: translateY(-1px);
    }

    .analyze-button:disabled { cursor: not-allowed; opacity: 0.55; }

    .progress-region {
      width: min(460px, 90%);
      margin: 30px auto 0;
      opacity: 1;
      transition: opacity 200ms ease;
    }

    .progress-region[hidden] { display: none; }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 11px;
      color: #d6e3f0;
      font-size: 0.88rem;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--tiktok-cyan);
      border-radius: 50%;
      animation: spin 720ms linear infinite;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
    }

    .progress-fill {
      width: 34%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--tiktok-cyan), var(--tiktok-red));
      animation: progress 1.25s ease-in-out infinite;
    }

    /* Results View Styling */
    .results-view { padding: 24px 0 28px; }

    .results-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    /* Hide divider line when 100% passed */
    .results-view.no-issues .results-header {
      border-bottom: none !important;
    }

    .results-header-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .results-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .results-subtitle {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .summary-stats {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 2px;
    }

    .stat { text-align: left; }

    .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-label {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* Top-Right Circular Score Badge */
    .score-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      flex: 0 0 88px;
      border-radius: 50%;
      background: rgba(8, 14, 26, 0.88);
      border: 3.5px solid var(--tiktok-red);
      box-shadow: 0 0 22px rgba(254, 4, 104, 0.35);
      transition: all 300ms ease;
      text-align: center;
      padding: 4px;
    }

    .score-circle[hidden] { display: none !important; }

    .score-circle .score-icon { color: var(--tiktok-red); }

    .score-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin-bottom: 2px;
    }

    .score-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.8;
    }

    .score-value {
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .score-label {
      font-size: 0.52rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Centered 100% Accuracy Stage with Single Static Green Line Ring */
    .success-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
      text-align: center;
    }

    .success-stage[hidden] { display: none !important; }

    .hud-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .hud-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .hud-center-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }

    .hud-score-number {
      font-size: 2.7rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--teal);
      text-shadow: none;
    }

    .hud-score-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--teal);
      margin-top: 6px;
      text-shadow: none;
    }

    .qa-passed-label {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--teal);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .success-title {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--white);
    }

    .success-subtitle {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .results-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    .results-controls[hidden] { display: none !important; }

    .compact-btn {
      min-height: 34px;
      padding: 6px 14px;
      font-size: 0.78rem;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.04);
    }

    .compact-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Skipped Notice Style: Light Grey Text without Yellow Box */
    .notice {
      margin: 14px 0 0;
      padding: 0;
      border: none;
      background: transparent;
      color: #a3b8cc;
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .notice[hidden] { display: none; }

    .results-list {
      display: grid;
      gap: 12px;
    }

    .campaign-group,
    .adgroup-group,
    .ad-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .adgroup-group,
    .ad-group { background: rgba(255, 255, 255, 0.03); }

    details > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 9px 13px;
      cursor: pointer;
      list-style: none;
    }

    details > summary::-webkit-details-marker { display: none; }

    details > summary::before {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      content: "";
      transform: rotate(-45deg);
      transition: transform 160ms ease;
    }

    details[open] > summary::before { transform: rotate(45deg); }

    .summary-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .summary-count {
      flex: 0 0 auto;
      margin-left: auto;
      color: var(--danger);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .group-body {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px 30px;
    }

    .adgroup-group .group-body { padding-left: 28px; }

    .ad-group { border-color: var(--danger-line); }

    .mismatch-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0 12px 12px 28px;
      list-style: none;
      transition: opacity 180ms ease;
    }

    .results-list.compact-mode .mismatch-list {
      display: none !important;
    }

    .mismatch-item {
      display: grid;
      grid-template-columns: minmax(115px, 0.65fr) minmax(0, 1fr) 20px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-left: 3px solid var(--tiktok-red);
      background: var(--danger-bg);
      font-size: 0.75rem;
    }

    .mismatch-field { color: #ffd6dc; font-weight: 600; font-size: 0.75rem; }

    .value-block { min-width: 0; }

    .value-source {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .value-text {
      display: block;
      font-size: 0.75rem;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .value-arrow { color: rgba(255, 255, 255, 0.45); font-size: 0.75rem; }

    .empty-state {
      padding: 0;
      border-top: none;
    }

    .empty-state[hidden] { display: none; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 18px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 7px;
      background: transparent;
      color: var(--white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .action-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-1px);
    }

    .action-button:disabled { cursor: not-allowed; opacity: 0.35; }

    .restart-button {
      min-height: 34px;
      padding: 6px 12px;
      border-color: rgba(255, 255, 255, 0.4);
      opacity: 0.72;
      font-size: 0.76rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes progress {
      0% { transform: translateX(-120%); }
      60%, 100% { transform: translateX(300%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 720px) {
      .app-shell { width: min(100% - 28px, 1080px); }
      .brand { margin-top: 32px; }
      .upload-grid { grid-template-columns: 1fr; gap: 8px; }
      .versus { min-height: 30px; }
      .file-name { min-height: 22px; }
      .results-view { padding-top: 20px; }
      .results-header { align-items: flex-start; }
      .group-body, .adgroup-group .group-body { padding-left: 12px; }
      .mismatch-list { padding-left: 12px; }
      .mismatch-item { grid-template-columns: 1fr; gap: 8px; }
      .value-arrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    
    <!-- Header -->
    <header class="brand" aria-label="TikTok QAer by DEPT">
      <img class="brand-logo-img" src="https://www.freepnglogos.com/uploads/tik-tok-logo-png/tik-tok-tiktok-logo-glitch-toedit-sticker-fly-wall-7.png" alt="TikTok Logo">
      <h1 class="brand-title">
        <span class="brand-title-main">TikTok</span>
        <span class="brand-title-accent">QAer</span>
        <span class="brand-title-dept">by DEPT</span>
      </h1>
    </header>

    <main>
      <!-- Upload Stage -->
      <section id="mainView" class="view main-view" aria-labelledby="mainHeading">
        <div class="upload-stage">
          <h2 id="mainHeading" hidden>Upload spreadsheets for TikTok QA comparison</h2>
          <div class="upload-grid">
            
            <div class="upload-slot">
              <input class="file-input" id="trafficFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" aria-describedby="trafficFileName">
              <label class="upload-button traffic" for="trafficFile">
                <i data-lucide="sheet" aria-hidden="true"></i>
                <span>Trafficking Sheet</span>
              </label>
              <span class="file-name" id="trafficFileName">No file selected</span>
            </div>

            <div class="versus" aria-hidden="true">vs</div>

            <div class="upload-slot">
              <input class="file-input" id="tiktokFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" aria-describedby="tiktokFileName">
              <label class="upload-button tiktok" for="tiktokFile">
                <i data-lucide="file-spreadsheet" aria-hidden="true"></i>
                <span>Exported TikTok Sheet</span>
              </label>
              <span class="file-name" id="tiktokFileName">No file selected</span>
            </div>

          </div>

          <div class="analyze-wrap">
            <button id="analyzeButton" class="analyze-button" type="button">
              <i data-lucide="scan-search" aria-hidden="true"></i>
              Analyze
            </button>
          </div>

          <div id="progressRegion" class="progress-region" role="status" aria-live="polite" hidden>
            <div class="progress-label"><span class="spinner" aria-hidden="true"></span>Analyzing TikTok Data...</div>
            <div class="progress-track" aria-hidden="true"><div class="progress-fill"></div></div>
          </div>
        </div>
      </section>

      <!-- Results Stage -->
      <section id="resultsView" class="view results-view" aria-labelledby="resultsHeading" hidden>
        <div class="results-header">
          <div class="results-header-left">
            <h2 id="resultsHeading" class="results-title">RESULTS</h2>
            <p id="resultsSubtitle" class="results-subtitle"></p>
            <div class="summary-stats" aria-label="Analysis summary">
              <div class="stat"><span id="adsChecked" class="stat-value">0</span><span class="stat-label">Ads checked</span></div>
              <div class="stat"><span id="adsFlagged" class="stat-value">0</span><span class="stat-label">Ads flagged</span></div>
              <div class="stat"><span id="issueCount" class="stat-value">0</span><span class="stat-label">Issues</span></div>
            </div>
          </div>

          <!-- Top-Right Score Circle Badge -->
          <div class="score-circle" id="scoreCircle">
            <div class="score-icon" id="scoreIcon">
              <i data-lucide="x-circle" aria-hidden="true"></i>
            </div>
            <div class="score-value" id="scoreValue">0%</div>
            <div class="score-label" id="scoreLabel">ISSUES</div>
          </div>
        </div>

        <p id="analysisNotice" class="notice" hidden></p>

        <!-- Centered 100% Accuracy Stage with Single Static Green Line Ring -->
        <div id="successStage" class="success-stage" hidden>
          <div class="hud-wrapper">
            <svg class="hud-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
              <circle cx="130" cy="130" r="110" fill="none" stroke="var(--teal)" stroke-width="3" />
            </svg>

            <div class="hud-center-content">
              <div class="hud-score-number">100%</div>
              <div class="hud-score-label">ACCURACY</div>
            </div>
          </div>

          <div class="qa-passed-label">QA PASSED</div>
          <h2 class="success-title">No discrepancies detected</h2>
          <p class="success-subtitle">The compared records passed all TikTok QA checks.</p>
        </div>

        <div id="resultsControls" class="results-controls" hidden>
          <button id="toggleDetailsBtn" class="action-button compact-btn" type="button">
            <i data-lucide="minimize-2" aria-hidden="true"></i>
            <span id="toggleDetailsText">Compact</span>
          </button>
        </div>

        <div id="resultsList" class="results-list"></div>

        <div class="actions">
          <button id="downloadButton" class="action-button" type="button">
            <i data-lucide="download" aria-hidden="true"></i>
            Download
          </button>
          <button id="restartButton" class="action-button restart-button" type="button">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            Restart
          </button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
